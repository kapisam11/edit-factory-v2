services:
  dashboard:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      AIVF_WORKERS: "2"
      AIVF_COOKIE_SECURE: "0"
    volumes:
      - ./output:/app/output
      - ./uploads:/app/uploads
      - ./knowledge_base_v2:/app/knowledge_base_v2
      - ./assets:/app/assets
