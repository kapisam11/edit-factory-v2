name: Docker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f 06-CONFIG-AND-DEPLOYMENT/Dockerfile -t edit-factory-v2:test .
      - name: Smoke-test production WSGI import
        run: |
          docker run --rm \
            -e AIVF_ALLOW_INSECURE_LOCAL=1 \
            --entrypoint python edit-factory-v2:test \
            -c "import sys; sys.path.insert(0, '/app/01-MAIN-CODE'); sys.path.insert(0, '/app/02-WEB-FILES'); import wsgi; print('production WSGI import ok')"
