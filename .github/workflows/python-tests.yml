name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install package and development dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[web,dev]"
        python -m pip check
    - name: Compile Python sources
      run: python -m compileall -q ai_video_factory tools cli.py web_app_v2.py
    - name: Run lint checks
      run: ruff check ai_video_factory tools cli.py web_app_v2.py
    - name: Run tests
      run: pytest -q
