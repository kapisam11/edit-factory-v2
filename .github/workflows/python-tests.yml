name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install package and development dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[web,dev]"
        python -m pip check
    - name: Compile Python sources
      run: python -m compileall -q ai_video_factory tools cli.py web_app_v2.py wsgi.py
    - name: Lint production entry points and audited modules
      run: |
        ruff check \
          ai_video_factory/validation.py \
          ai_video_factory/pipeline.py \
          ai_video_factory/thumbnail_learning.py \
          cli.py wsgi.py \
          --select E4,E7,E9,F --ignore F401,F811,F841
    - name: Run tests with coverage
      env:
        PYTHONPATH: .
      run: pytest -q --cov=ai_video_factory --cov=tools --cov-report=term-missing --cov-report=xml

  dependency-audit:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Install package and audit dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[web,dev,audit]"
        python -m pip check
    - name: Audit dependencies
      run: pip-audit
