name: Python package

on:
  push:
    branches: [ main, production-hardening-10-of-10 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install package and development dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[web,dev]"
        python -m pip check
    - name: Compile Python sources
      run: python -m compileall -q app ai_video_factory 03-SIDE-CODE/tools cli.py cli_v2.py web_app_v2.py dashboard_auth.py dashboard_compat.py dashboard_shutdown.py dashboard_worker.py wsgi.py gunicorn.conf.py
    - name: Lint production Python for correctness
      run: ruff check app ai_video_factory 03-SIDE-CODE/tools cli.py cli_v2.py web_app_v2.py dashboard_auth.py dashboard_compat.py dashboard_shutdown.py dashboard_worker.py wsgi.py gunicorn.conf.py --select E9,F --ignore F401,F811,F841
    - name: Smoke-test command entry points
      run: |
        python cli.py --help
        python cli_v2.py --help
        aivf --help
    - name: Run tests with coverage
      env:
        PYTHONPATH: .
      run: pytest -q --cov=ai_video_factory --cov=tools --cov=app --cov-report=term-missing --cov-report=xml

  windows-smoke:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install package and development dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[web,dev]"
        python -m pip check
    - name: Compile spawn-sensitive modules
      shell: pwsh
      run: python -m compileall -q app ai_video_factory 03-SIDE-CODE/tools web_app_v2.py dashboard_auth.py dashboard_compat.py dashboard_shutdown.py dashboard_worker.py wsgi.py
    - name: Run Windows-safe hardening tests
      shell: pwsh
      env:
        PYTHONPATH: .
      run: pytest -q 04-TESTS/tests/test_dashboard_auth.py 04-TESTS/tests/test_dashboard_security.py 04-TESTS/tests/test_dashboard_lifecycle.py 04-TESTS/tests/test_config_roundtrip.py 04-TESTS/tests/test_model_adapter_security.py 04-TESTS/tests/test_pipeline_retry_policy.py

  dependency-audit:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Install package and audit dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[web,dev,audit]"
        python -m pip check
    - name: Audit dependencies
      run: pip-audit
