name: Refresh uv lock

on:
  push:
    branches:
      - repo-audit-2026-09-03

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Resolve lockfile
        run: uv lock
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: add reproducible uv lockfile"
          git push
