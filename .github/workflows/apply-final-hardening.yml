name: Apply final hardening patch

on:
  push:
    branches: [production-hardening-10-of-10]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: apply final hardening patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply final source and CI corrections
        shell: python
        run: |
          from pathlib import Path

          p = Path('web_app_v2.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('''_runtime_secrets: Dict[str, Dict[str, str]] = {}\n_active_processes: Dict[str, multiprocessing.Process] = {}''', '''_runtime_secrets: Dict[str, Dict[str, str]] = {}\n_runtime_default_secrets: Dict[str, str] = {key: "" for key in SECRET_PARAM_KEYS}\n_active_processes: Dict[str, multiprocessing.Process] = {}''')
          s = s.replace('''def check_rate_limit(client_ip: str, max_requests: int = 10, window_seconds: int = 60) -> bool:\n''', '''def set_runtime_default_secret(key: str, value: str) -> None:\n    if key not in SECRET_PARAM_KEYS:\n        raise ValueError(f"Unsupported runtime secret: {key}")\n    _runtime_default_secrets[key] = str(value or "").strip()\n\n\ndef get_runtime_default_secrets() -> dict:\n    return dict(_runtime_default_secrets)\n\n\ndef check_rate_limit(client_ip: str, max_requests: int = 10, window_seconds: int = 60) -> bool:\n''')
          s = s.replace('''def _run_job_worker(job_id: str, params: dict, secrets: dict, output_root: str, db_path: str) -> None:\n''', '''def _run_job_worker_impl(job_id: str, params: dict, secrets: dict, output_root: str, db_path: str) -> None:\n''')
          s = s.replace('''    process = ctx.Process(\n        target=_run_job_worker,\n''', '''    from dashboard_worker import run_job\n    process = ctx.Process(\n        target=run_job,\n''')
          s = s.replace('''    secrets = {key: str(data.get(key, "")).strip() for key in SECRET_PARAM_KEYS if data.get(key)}\n''', '''    secrets = get_runtime_default_secrets()\n    secrets.update({key: str(data.get(key, "")).strip() for key in SECRET_PARAM_KEYS if data.get(key)})\n''')
          s = s.replace('''if __name__ == "__main__":\n    app.run(host="0.0.0.0", port=5000, debug=False, threaded=True)\n''', '''if __name__ == "__main__":\n    from dashboard_auth import configure_dashboard_auth\n    from dashboard_compat import register_dashboard_compat\n    configure_dashboard_auth(app)\n    register_dashboard_compat(app)\n    app.run(host="0.0.0.0", port=5000, debug=False, threaded=True)\n''')
          p.write_text(s, encoding='utf-8')

          p = Path('dashboard_compat.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('import multiprocessing\n', '')
          start = s.index('\ndef _spawn_worker(')
          end = s.index('\ndef _cleanup_old_packages', start)
          s = s[:start] + s[end:]
          s = s.replace('''    original_start_job = web_app_v2._start_job\n    web_app_v2._run_job_worker = _spawn_worker\n\n    def hardened_start_job(job_id, params, secrets):\n        merged = dict(_DASHBOARD_SECRETS)\n        merged.update({k: v for k, v in (secrets or {}).items() if v})\n        with _START_LOCK:\n            active = sum(1 for process in web_app_v2._active_processes.values() if process.is_alive())\n            capacity = max(1, int(web_app_v2.get_settings()["max_concurrent_jobs"]))\n            if active >= capacity:\n                return True\n            return original_start_job(job_id, params, merged)\n\n''', '')
          s = s.replace('''            for key in SECRET_KEYS:\n                if key in data:\n                    _DASHBOARD_SECRETS[key] = str(data[key] or "").strip()\n''', '''            for key in SECRET_KEYS:\n                if key in data:\n                    value = str(data[key] or "").strip()\n                    _DASHBOARD_SECRETS[key] = value\n                    web_app_v2.set_runtime_default_secret(key, value)\n''')
          s = s.replace('''    def hardened_create_job():\n        response = original_create_job()\n        if getattr(response, "status_code", 500) < 300:\n            payload = response.get_json(silent=True) or {}\n            job_id = payload.get("job_id")\n            if job_id:\n                web_app_v2._runtime_secrets[job_id] = dict(_DASHBOARD_SECRETS)\n        return response\n''', '''    def hardened_create_job():\n        return web_app_v2.create_job()\n''')
          s = s.replace('''    app.view_functions["cancel_job"] = hardened_cancel_job\n    web_app_v2._start_job = hardened_start_job\n''', '''    app.view_functions["cancel_job"] = hardened_cancel_job\n''')
          p.write_text(s, encoding='utf-8')

          p = Path('Dockerfile')
          s = p.read_text(encoding='utf-8')
          s = s.replace('COPY dashboard_auth.py dashboard_compat.py ', 'COPY dashboard_auth.py dashboard_compat.py dashboard_worker.py ')
          p.write_text(s, encoding='utf-8')

          p = Path('.github/workflows/python-tests.yml')
          s = p.read_text(encoding='utf-8')
          if 'windows-smoke:' not in s:
              s += '''\n\n  windows-smoke:\n    runs-on: windows-latest\n    steps:\n    - uses: actions/checkout@v6\n    - name: Set up Python\n      uses: actions/setup-python@v5\n      with:\n        python-version: '3.12'\n    - name: Install package and development dependencies\n      shell: bash\n      run: |\n        python -m pip install --upgrade pip\n        python -m pip install -e ".[web,dev]"\n        python -m pip check\n    - name: Compile spawn-sensitive production modules\n      run: python -m compileall -q web_app_v2.py dashboard_auth.py dashboard_compat.py dashboard_worker.py wsgi.py\n    - name: Run Windows lifecycle/security tests\n      shell: bash\n      env:\n        PYTHONPATH: .\n      run: >-\n        pytest -q tests/test_dashboard_auth.py tests/test_dashboard_security.py\n        tests/test_dashboard_lifecycle.py tests/test_config_roundtrip.py\n        tests/test_model_adapter_security.py tests/test_pipeline_retry_policy.py\n'''
              p.write_text(s, encoding='utf-8')

          Path('.github/workflows/apply-final-hardening.yml').unlink()
      - name: Commit final corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web_app_v2.py dashboard_compat.py Dockerfile .github/workflows/python-tests.yml .github/workflows/apply-final-hardening.yml
          git commit -m 'chore: apply final hardening patch' || exit 0
          git push
