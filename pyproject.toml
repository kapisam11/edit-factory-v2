[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-factory"
version = "2.2.0"
description = "Generate research-backed short video packages with AI planning and auto-edit support."
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
    "pillow>=9.0.0",
    "requests>=2.28.0",
    "edge-tts>=6.1.0",
    "numpy>=1.23.0",
]

[project.scripts]
aivf = "cli:main"

[project.optional-dependencies]
web = ["flask>=2.3.0", "gunicorn>=22.0.0; platform_system != 'Windows'"]
dev = ["pytest>=7.0", "pytest-cov>=5.0", "mypy>=1.0", "ruff>=0.6.0"]
audit = ["pip-audit>=2.9.0"]
beats = ["librosa>=0.10.0"]
vision = ["opencv-python-headless>=4.8.0"]
ocr = ["pytesseract>=0.3.10", "opencv-python-headless>=4.8.0"]
diarization = ["pyannote.audio>=3.1.0"]
full = [
    "librosa>=0.10.0",
    "opencv-python-headless>=4.8.0",
    "pytesseract>=0.3.10",
    "pyannote.audio>=3.1.0",
]
groq = ["groq>=0.4.0"]
elevenlabs = ["elevenlabs>=0.2.0"]

# The repository is intentionally grouped by purpose, but the Python package
# itself lives in one importable source root. Keeping discovery inside the
# repository avoids setuptools resolving package sources through ../ paths.
[tool.setuptools]
package-dir = {"" = "01-MAIN-CODE"}
py-modules = [
    "cli",
    "cli_v2",
    "dashboard_auth",
    "dashboard_compat",
    "dashboard_shutdown",
    "dashboard_worker",
    "web_app_v2",
    "wsgi",
]

[tool.setuptools.packages.find]
where = ["01-MAIN-CODE"]
include = ["ai_video_factory*"]
exclude = ["tests*", "00-INFO*", "99-ARCHIVE*", ".models*", ".tools*"]

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = [".tools", ".models", "output", "uploads"]
