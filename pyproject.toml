[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-factory"
version = "2.1.0"
description = "Generate research-backed short video packages with AI planning and auto-edit support."
requires-python = ">=3.9"
dependencies = [
    "pillow>=9.0.0",
    "requests>=2.28.0",
    "edge-tts>=6.1.0",
    "numpy>=1.23.0",
]

[project.scripts]
aivf = "cli_v2:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.0"]
beats = ["librosa>=0.10.0"]
vision = ["opencv-python-headless>=4.8.0"]
ocr = ["pytesseract>=0.3.10", "opencv-python-headless>=4.8.0"]
diarization = ["pyannote.audio>=3.1.0"]
full = [
    "librosa>=0.10.0",
    "opencv-python-headless>=4.8.0",
    "pytesseract>=0.3.10",
    "pyannote.audio>=3.1.0",
]
groq = ["groq>=0.4.0"]
elevenlabs = ["elevenlabs>=0.2.0"]

[tool.setuptools]
packages = ["ai_video_factory"]
py-modules = ["cli_v2"]
