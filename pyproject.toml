[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-factory"
version = "0.2.0"
description = "Generate research-backed short video packages with auto-edit support."
requires-python = ">=3.9"
dependencies = [
    "pillow>=9.0.0",
    "requests>=2.28.0",
    "edge-tts>=6.1.0",
    "numpy>=1.23.0",
]

[project.optional-dependencies]
web = ["flask>=2.3.0"]
dev = ["pytest>=7.0", "mypy>=1.0", "ruff>=0.6.0"]
beats = ["librosa>=0.10.0"]
groq = ["groq>=0.4.0"]
elevenlabs = ["elevenlabs>=0.2.0"]

[tool.setuptools.packages.find]
include = ["ai_video_factory*", "tools*"]
exclude = ["tests*", "docs*", ".models*", ".tools*"]

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = [".tools", ".models", "output", "uploads"]
