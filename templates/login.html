<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Factory — Sign In</title>
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #0f1117; color: #f4f7fb; }
        .card { width: min(420px, calc(100% - 32px)); background: #171a22; border: 1px solid #2b3140; border-radius: 16px; padding: 28px; box-sizing: border-box; }
        h1 { margin: 0 0 8px; font-size: 24px; }
        p { color: #aeb7c7; }
        label { display: block; margin: 20px 0 8px; font-weight: 600; }
        input { width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 10px; border: 1px solid #3a4252; background: #10131a; color: #fff; }
        button { width: 100%; margin-top: 18px; padding: 12px 14px; border: 0; border-radius: 10px; cursor: pointer; font-weight: 700; }
        .error { padding: 10px 12px; border-radius: 10px; background: #3a1d25; color: #ffb8c5; }
        .hint { font-size: 13px; color: #7f8aa0; }
    </style>
</head>
<body>
    <main class="card">
        <h1>AI VIDEO FACTORY</h1>
        <p>Sign in to access the production dashboard.</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="post" action="/login">
            <input type="hidden" name="next" value="{{ next or '' }}">
            <label for="password">Admin password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
            <button type="submit">Sign in</button>
        </form>
        <p class="hint">Configure AIVF_ADMIN_PASSWORD and FLASK_SECRET_KEY in your environment.</p>
    </main>
</body>
</html>
